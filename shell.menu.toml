# Replaces the whole [menu] section of the generated shell.toml, so every key
# is listed. Only text and selected-text differ from Omarchy's defaults.
[menu]
background                = "#1e1e2e"
background-alpha          = 1.0
text                      = "#22d3ee"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#1e1e2e"
scrim-alpha               = 0.5
selected-background       = "#cdd6f4"
selected-background-alpha = 0.08
selected-text             = "#f472b6"
selected-border           = "hyprland.active-border-foreground"
selected-border-alpha     = 0.25
